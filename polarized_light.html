<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Polarized Light Microscopy Sample Rotation Widget</title>
<style>
  :root {
    --blue:#12b8e8;
    --navy:#142b45;
    --red:#ff230d;
    --muted:#5c6d86;
    --line:#dfe8f2;
    --bg:#f5f8fc;
  }
  * { box-sizing:border-box; }
  body {
    margin:0;
    padding:18px;
    background:var(--bg);
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:#223;
  }
  .widget {
    max-width:1220px;
    margin:0 auto;
    background:#fff;
    border:2px solid var(--line);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 12px 30px rgba(20,43,69,.08);
  }
  .stage {
    background:#fff;
    border-bottom:2px solid var(--line);
  }
  svg { display:block; width:100%; height:auto; }
  .red-label { fill:var(--red); font-size:30px; font-weight:600; }
  .small-label { fill:var(--muted); font-size:17px; font-weight:650; }
  .tiny-label { fill:var(--muted); font-size:15px; font-weight:600; }
  .arrow-line { stroke:var(--blue); stroke-width:5; stroke-linecap:round; }
  .controls {
    padding:18px 24px 22px;
    display:grid;
    grid-template-columns:145px 1fr 90px;
    gap:14px 18px;
    align-items:center;
  }
  .controls label { font-size:19px; font-weight:750; color:#223; }
  input[type="range"] { width:100%; accent-color:var(--blue); }
  .value { text-align:right; font-size:22px; font-weight:850; color:#1f2031; }
  .bar {
    height:14px;
    border-radius:999px;
    overflow:hidden;
    background:#dbe6f3;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.16);
  }
  .fill { height:100%; width:0%; background:var(--blue); }
  .caption {
    grid-column:1/-1;
    color:var(--muted);
    font-size:18px;
    line-height:1.35;
  }
  .caption b { color:#243047; }
  @media (max-width:800px) {
    body { padding:8px; }
    .controls { grid-template-columns:1fr 72px; padding:14px; }
    .controls label { grid-column:1/-1; }
    .caption { font-size:16px; }
  }
</style>
</head>
<body>
<div class="widget">
  <div class="stage">
    <svg viewBox="0 0 1400 560" role="img" aria-label="Polarized light microscopy diagram with rotating sample">
      <defs>
        <marker id="arrowEnd" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M 0 0 L 14 7 L 0 14 z" fill="var(--blue)"></path>
        </marker>
        <marker id="arrowStart" markerWidth="14" markerHeight="14" refX="2" refY="7" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M 14 0 L 0 7 L 14 14 z" fill="var(--blue)"></path>
        </marker>
        <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
          <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.16"/>
        </filter>
      </defs>

      <!-- Unpolarized light: many small direction indicators -->
      <g class="arrow-line" marker-end="url(#arrowEnd)">
        <line x1="120" y1="255" x2="120" y2="170"/>
        <line x1="120" y1="255" x2="120" y2="340"/>
        <line x1="120" y1="255" x2="48" y2="214"/>
        <line x1="120" y1="255" x2="192" y2="214"/>
        <line x1="120" y1="255" x2="48" y2="296"/>
        <line x1="120" y1="255" x2="192" y2="296"/>
      </g>

      <!-- Polarizer -->
      <g transform="translate(285 122) skewY(-25)" fill="none" stroke-linejoin="round">
        <rect x="0" y="0" width="130" height="210" stroke="var(--navy)" stroke-width="5"/>
        <g stroke="#000" stroke-width="7">
          <line x1="26" y1="0" x2="26" y2="210"/>
          <line x1="52" y1="0" x2="52" y2="210"/>
          <line x1="78" y1="0" x2="78" y2="210"/>
          <line x1="104" y1="0" x2="104" y2="210"/>
        </g>
      </g>
      <text class="red-label" x="278" y="475">Polarizer</text>

      <!-- Vertical polarized light after polarizer -->
      <g class="arrow-line" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)">
        <line x1="505" y1="188" x2="505" y2="332"/>
      </g>

      <text id="signalLabel" class="small-label" x="1188" y="328">Birefringent signal: 100%</text>
    </svg>
  </div>

  <div class="controls">
    <label for="angle">Rotate sample</label>
    <input id="angle" type="range" min="0" max="180" value="45" step="1" />
    <div class="value"><span id="angleValue">45</span>°</div>

    <label>Image signal</label>
    <div class="bar"><div id="fill" class="fill"></div></div>
    <div class="value"><span id="signalValue">100</span>%</div>

    <div class="caption"><b>What the slider means:</b> the polarizer and analyzer stay fixed. Only the green sample rotates. The image is darkest when the sample lines up with the polarizer/analyzer and brightest near 45°.</div>
  </div>
</div>

<script>
const slider = document.getElementById('angle');
const sample = document.getElementById('sampleGroup');
const angleValue = document.getElementById('angleValue');
const sampleAngleText = document.getElementById('sampleAngleText');
const signalValue = document.getElementById('signalValue');
const signalLabel = document.getElementById('signalLabel');
const fill = document.getElementById('fill');
const resultImage = document.getElementById('resultImage');
const transmittedArrow = document.getElementById('transmittedArrow');
const alteredLine = document.querySelector('#alteredPolarization line');

function setArrowByAngle(line, cx, cy, length, deg) {
  const rad = deg * Math.PI / 180;
  const dx = Math.cos(rad) * length / 2;
  const dy = Math.sin(rad) * length / 2;
  line.setAttribute('x1', cx - dx);
  line.setAttribute('y1', cy - dy);
  line.setAttribute('x2', cx + dx);
  line.setAttribute('y2', cy + dy);
}

function update() {
  const theta = Number(slider.value);
  const rad = theta * Math.PI / 180;
  const signal = Math.pow(Math.sin(2 * rad), 2);
  const pct = Math.round(signal * 100);

  sample.setAttribute('transform', `translate(650 260) rotate(${theta})`);
  angleValue.textContent = theta;
  sampleAngleText.textContent = `sample angle: ${theta}°`;
  signalValue.textContent = pct;
  signalLabel.textContent = `Birefringent signal: ${pct}%`;
  fill.style.width = `${pct}%`;

  // Image appearance changes with signal.
  resultImage.setAttribute('opacity', (0.12 + 0.88 * signal).toFixed(2));
  resultImage.style.filter = `brightness(${0.22 + 0.95 * signal}) saturate(${0.45 + 0.8 * signal})`;
  transmittedArrow.setAttribute('opacity', (0.22 + 0.78 * signal).toFixed(2));

  // Clean single polarization indicator after the sample. Text does not rotate.
  const arrowAngle = -55 + 38 * Math.sin(2 * rad);
  setArrowByAngle(alteredLine, 820, 260, 150, arrowAngle);
}

slider.addEventListener('input', update);
update();
</script>
