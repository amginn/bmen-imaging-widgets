<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Phase Contrast Microscopy Widget</title>
<style>
  :root {
    --bg: #f7f7f7;
    --panel: #ffffff;
    --ink: #111111;
    --muted: #666666;
    --line: #d7d7d7;
    --accent: #555555;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px;
  }

  .widget {
    width: min(1120px, 100%);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.08);
  }

  .top {
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 22px;
    align-items: stretch;
  }

  .stage, .imageBox {
    border: 1px solid var(--line);
    border-radius: 14px;
    background: #fff;
    overflow: hidden;
    position: relative;
  }

  .stage {
    min-height: 520px;
    padding: 14px;
  }

  .imageBox {
    min-height: 520px;
    display: grid;
    place-items: center;
    padding: 28px;
  }

  canvas {
    display: block;
    width: 100%;
    height: 488px;
  }

  .label {
    position: absolute;
    top: 18px;
    left: 22px;
    font-size: 22px;
    font-weight: 700;
    z-index: 3;
  }

  .micrograph {
    width: min(100%, 520px);
    aspect-ratio: 350 / 214;
    position: relative;
    overflow: hidden;
    background: #ddd;
  }

  .micrograph img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    user-select: none;
    pointer-events: none;
  }

  #contrastImg { opacity: 0; }

  .controls {
    margin-top: 22px;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 22px;
    background: #fbfbfb;
  }

  .controlRow {
    display: grid;
    grid-template-columns: 150px 1fr 80px;
    gap: 16px;
    align-items: center;
  }

  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
  }

  .value {
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }

  @media (max-width: 880px) {
    .top { grid-template-columns: 1fr; }
    .stage, .imageBox { min-height: 390px; }
    canvas { height: 360px; }
    .controlRow { grid-template-columns: 1fr; gap: 8px; }
    .value { text-align: left; }
  }
</style>
</head>

    <section class="controls">
      <div class="controlRow">
        <label for="phaseSlider">Phase shift</label>
        <input id="phaseSlider" type="range" min="0" max="90" step="1" value="0" />
        <div class="value"><span id="phaseValue">0</span>°</div>
      </div>
    </section>
  </main>

<script>
  const canvas = document.getElementById("waveCanvas");
  const ctx = canvas.getContext("2d");
  const slider = document.getElementById("phaseSlider");
  const phaseValue = document.getElementById("phaseValue");
  const contrastImg = document.getElementById("contrastImg");

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function roundRect(ctx, x, y, w, h, r, fill, stroke) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
    if (fill) ctx.fill();
    if (stroke) ctx.stroke();
  }

  function wavePath(x, top, bottom, amp, cycles, phase) {
    const p = new Path2D();
    const steps = 420;
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const y = top + t * (bottom - top);
      const xx = x + amp * Math.sin(t * cycles * Math.PI * 2 + phase);
      if (i === 0) p.moveTo(xx, y);
      else p.lineTo(xx, y);
    }
    return p;
  }

  function strokeWave(path, width, alpha = 1) {
    ctx.save();
    ctx.lineWidth = width;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#000";
    ctx.globalAlpha = alpha;
    ctx.stroke(path);
    ctx.restore();
  }

  function drawSpecimen(x, y) {
    ctx.save();
    ctx.fillStyle = "rgba(150,150,150,0.35)";
    ctx.strokeStyle = "rgba(130,130,130,0.55)";
    ctx.lineWidth = 8;
    roundRect(ctx, x - 66, y - 26, 132, 52, 26, true, true);
    ctx.restore();
  }

  function drawPhaseRing(x, y) {
    ctx.save();
    ctx.fillStyle = "rgba(25,185,235,0.72)";
    ctx.strokeStyle = "rgba(25,185,235,0.68)";
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.ellipse(x, y, 112, 28, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function drawReferenceLines(y1, y2, x1, x2) {
    ctx.save();
    ctx.strokeStyle = "rgba(255, 40, 20, 0.42)";
    ctx.lineWidth = 4;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y1);
    ctx.moveTo(x1, y2);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.restore();
  }

  function sampleExtremaY(top, bottom, cycles) {
    const ys = [];
    const height = bottom - top;
    for (let k = 0; k < cycles * 2 + 2; k++) {
      const theta = Math.PI / 2 + k * Math.PI;
      const t = theta / (cycles * Math.PI * 2);
      if (t >= 0 && t <= 1) ys.push(top + t * height);
    }
    // Pick the two adjacent extrema in the lower half, matching the user's marked region.
    const lower = ys.filter(y => y > top + height * 0.50 && y < top + height * 0.88);
    return lower.slice(0, 2);
  }

  function draw() {
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);

    const phaseDeg = Number(slider.value);
    const platePhase = phaseDeg * Math.PI / 180;
    const contrast = phaseDeg / 90;

    phaseValue.textContent = phaseDeg;
    contrastImg.style.opacity = contrast.toFixed(3);

    const top = 96;
    const bottom = h - 56;
    const yMid = h * 0.42;

    const bgX = w * 0.32;
    const sampleX = w * 0.68;
    const amp = Math.max(34, w * 0.065);
    const cycles = 3.0;

    ctx.fillStyle = "#111";
    ctx.font = "28px Arial, Helvetica, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("Background", bgX, 62);
    ctx.fillText("Sample", sampleX, 62);

    ctx.save();
    ctx.strokeStyle = "#999";
    ctx.lineWidth = 14;
    ctx.beginPath();
    ctx.moveTo(18, yMid);
    ctx.lineTo(w - 18, yMid);
    ctx.stroke();
    ctx.restore();

    drawSpecimen(sampleX, yMid);

    const extrema = sampleExtremaY(top, bottom, cycles);
    const y1 = extrema[0] || (yMid + 115);
    const y2 = extrema[1] || (yMid + 185);
    drawReferenceLines(y1, y2, w * 0.14, w * 0.86);

    // Only the background wave moves.
    strokeWave(wavePath(bgX, top, bottom, amp, cycles, platePhase), 5, 1);

    // The sample wave stays fixed.
    strokeWave(wavePath(sampleX, top, bottom, amp, cycles, 0), 5, 1);
  }

  slider.addEventListener("input", draw);
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();
</script>
